<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Práctica 3.3</title>
    <link rel="stylesheet" href="inicio_sesion.css">
</head>
<body>
    
    <!-- Contenedor principal para dividir la pantalla -->
    <main class="contenedor-dividido">
        
        <!-- Mitad Izquierda: El formulario de Login y Logo -->
        <section class="mitad-login">
            
            <div class="encabezado-login">
                <img src="images/Mesa_verde.png" alt="Logo Mesa Verde" class="logo-pequeno">
                <span class="nombre-banco">Mesa Verde</span>
            </div>

            <div class="inicio_sesion">
                <h1>Inicio de sesión</h1>
                <h2>Ingrese los datos del usuario</h2>
                
                <input type="text" placeholder="Usuario">
                <input type="password" placeholder="Contraseña">
                
                <button class="btn-ingresar">Iniciar sesión</button>

            </div>
        </section>

        <!-- Mitad Derecha: La imagen del lobby del banco -->
        <section class="mitad-imagen">
            <img src="C:\CRUD\EncryptedCRUD\frontEnd\images\cabalo.jpg" alt="Lobby Mesa Verde">
        </section>

    </main>

</body>
</html>
