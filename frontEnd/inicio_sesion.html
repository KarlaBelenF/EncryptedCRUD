<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Práctica 3.3</title>
    <link rel="stylesheet" href="inicio_sesion.css">
</head>
<body>
    
    <main class="contenedor-dividido">
        <section class="mitad-login">
            
            <div class="encabezado-login">
                <img src="images/Mesa_verde.png" alt="Logo Mesa Verde" class="logo-pequeno">
                <span class="nombre-banco">Mesa Verde</span>
            </div>

            <div class="inicio_sesion">
                <h1>Inicio de sesión</h1>
                <h2>Ingrese los datos del usuario</h2>
                
                <input type="text" id="input-correo" placeholder="Correo electrónico">
                <input type="password" id="input-password" placeholder="Contraseña">
                
                <button class="btn-ingresar" id="btn-login">Iniciar sesión</button>

            </div>
        </section>
        <section class="mitad-imagen">
            <img src="images/cabalo.jpg" alt="Lobby Mesa Verde">
        </section>

    </main>

    <script src="login.js"></script>
</body>
</html>
